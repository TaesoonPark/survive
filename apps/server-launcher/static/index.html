<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>Survive Dedicated Server</title>
    <link rel="stylesheet" href="./launcher.css" />
  </head>
  <body>
    <header class="bar">
      <h1>Dedicated Server</h1>
      <span id="state" class="pill pill--idle">Stopped</span>
    </header>

    <main class="grid">
      <section class="panel">
        <h2>Configuration</h2>
        <form id="settings" autocomplete="off">
          <label>Server Name <input name="serverName" type="text" maxlength="48" /></label>
          <label>Port <input name="port" type="number" min="1024" max="65535" /></label>
          <label>Max Players <input name="maxPlayers" type="number" min="1" max="256" /></label>
          <label>Password <input name="password" type="password" placeholder="(none)" /></label>
          <label>
            Save
            <span class="row">
              <input name="world" type="text" list="worlds" />
              <datalist id="worlds"></datalist>
            </span>
          </label>
          <label>
            Save Folder
            <span class="row">
              <input name="saveDir" type="text" />
              <button type="button" id="pick-dir" class="ghost">Browse</button>
              <button type="button" id="open-dir" class="ghost">Open</button>
            </span>
          </label>
          <label
            >Storage
            <select name="backend">
              <option value="fs">Files (portable)</option>
              <option value="sqlite">SQLite (faster batches)</option>
            </select>
          </label>
          <label>Seed <input name="seed" type="number" placeholder="(from world name)" /></label>

          <fieldset>
            <legend>Rules</legend>
            <label class="check"><input name="pvp" type="checkbox" /> PvP</label>
            <label class="check"><input name="pauseWhenEmpty" type="checkbox" /> Pause Empty</label>
          </fieldset>

          <fieldset>
            <legend>Difficulty</legend>
            <label
              >Zombie Density <input name="zombieDensity" type="number" step="0.1" min="0" max="10"
            /></label>
            <label
              >Loot Abundance <input name="lootAbundance" type="number" step="0.1" min="0" max="10"
            /></label>
            <label
              >Need Rate <input name="needRate" type="number" step="0.1" min="0" max="10"
            /></label>
          </fieldset>

          <label
            >Log Level
            <select name="logLevel">
              <option value="debug">debug</option>
              <option value="info">info</option>
              <option value="warn">warn</option>
              <option value="error">error</option>
            </select>
          </label>

          <div class="actions">
            <button type="button" id="start" class="primary">START SERVER</button>
            <button type="button" id="stop" class="danger" disabled>STOP</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>Status</h2>
        <dl class="stats">
          <div>
            <dt>Players</dt>
            <dd id="m-players">0 / 0</dd>
          </div>
          <div>
            <dt>CPU</dt>
            <dd id="m-cpu">-</dd>
          </div>
          <div>
            <dt>RAM</dt>
            <dd id="m-ram">-</dd>
          </div>
          <div>
            <dt>Uptime</dt>
            <dd id="m-uptime">-</dd>
          </div>
          <div>
            <dt>In-game</dt>
            <dd id="m-time">-</dd>
          </div>
          <div>
            <dt>Weather</dt>
            <dd id="m-weather">-</dd>
          </div>
          <div>
            <dt>Chunks</dt>
            <dd id="m-chunks">0</dd>
          </div>
          <div>
            <dt>Entities</dt>
            <dd id="m-entities">0</dd>
          </div>
          <div>
            <dt>Tick</dt>
            <dd id="m-tick">0</dd>
          </div>
          <div>
            <dt>Step time</dt>
            <dd id="m-step">-</dd>
          </div>
          <div>
            <dt>Dropped ticks</dt>
            <dd id="m-dropped">0</dd>
          </div>
          <div>
            <dt>Address</dt>
            <dd id="m-address">-</dd>
          </div>
        </dl>

        <h2>Logs</h2>
        <div class="log-tools">
          <button type="button" id="clear-log" class="ghost">Clear</button>
          <label class="check"><input id="follow" type="checkbox" checked /> Follow</label>
        </div>
        <pre id="log" class="log" aria-live="polite"></pre>
      </section>
    </main>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
