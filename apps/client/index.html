<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Survive</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #07090a;
        color: #dfe6e6;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        /* The game reads mouse position continuously; a text cursor would be noise. */
        user-select: none;
        -webkit-user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 12px;
        z-index: 10;
        background: #07090a;
        transition: opacity 220ms ease;
      }
      #boot[hidden] {
        display: none;
      }
      #boot h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        font-weight: 600;
      }
      #boot p {
        margin: 0;
        color: #7d8e8f;
        font-size: 13px;
      }
      #boot-error {
        max-width: 60ch;
        color: #d9736a;
        font-size: 13px;
        text-align: center;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">
      <h1>Survive</h1>
      <p id="boot-status">starting…</p>
      <p id="boot-error"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
